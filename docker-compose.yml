# The test park (srv-web, srv-ssh, pc-01, printer-01) starts with the application.
include:
  - parcTest/docker-compose.yml

# Settings shared by the web application and the supervision loop.
x-django-env: &django-env
  DJANGO_SECRET_KEY: dev-secret-key-change-me
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
  POSTGRES_HOST: db
  POSTGRES_DB: supervision
  POSTGRES_USER: supervision
  POSTGRES_PASSWORD: supervision

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: supervision
      POSTGRES_USER: supervision
      POSTGRES_PASSWORD: supervision
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # -h localhost checks the real TCP server, not the temporary one used during the first initialisation.
      test: ["CMD-SHELL", "pg_isready -h localhost -U supervision -d supervision"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    environment: *django-env
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  supervisor:
    build: .
    restart: unless-stopped
    environment: *django-env
    # The web container already runs the migrations, so this one only starts the loop.
    entrypoint: []
    command: ["python", "manage.py", "supervise"]
    # On the default network to reach the database, and on the park network to reach the devices.
    networks:
      - default
      - testParc_net
    depends_on:
      web:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  db_data:
  static_data:
  media_data: