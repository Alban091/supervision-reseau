<!DOCTYPE html>
<html lang="fr">
<head>

    <title>Erreur interne du serveur</title>

        body {
            background-color: #f1cdcd;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }
        .box {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
        }
        .code {
            font-size: 80px;

        a {
            display: inline-block;

            padding: 10px 20px;
            background-color: #0d6efd;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="box">
        <p class="code">500</p>
        <h1>Erreur du serveur</h1>

        <a href="/">Retour à l'accueil</a>
