networks:
  testParc_net:
    name: testParc_network



services:
  pc:
    image: alpine:3.24
    container_name: container-pc
    init: true
    command: sleep infinity
    networks:
      - testParc_net

  web:
    image: nginx:alpine
    container_name: container-web
    init: true
    command: ["sh", "-c", "nginx && exec sleep infinity"]
    networks:
      - testParc_net